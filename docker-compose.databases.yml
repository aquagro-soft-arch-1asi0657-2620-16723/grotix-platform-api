# Bases MySQL / TimescaleDB autogestionadas para laboratorio o Azure VM unica.
# Los puertos se vinculan EXCLUSIVAMENTE a 127.0.0.1; desde los otros contenedores
# usar mysql:3306 y postgres:5432. No publicar puertos de BD en Internet.
# Para combinar: docker compose -f docker-compose.yml -f docker-compose.databases.yml up -d
# En ese caso configurar MYSQL_HOST=mysql, POSTGRES_HOST=postgres y SSL Mode=Disabled en .env.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB:-grotix_core}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${MYSQL_PUBLISHED_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  postgres:
    image: timescale/timescaledb:2.32.0-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grotix_telemetry}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISHED_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  mysql_data:
  postgres_data:
