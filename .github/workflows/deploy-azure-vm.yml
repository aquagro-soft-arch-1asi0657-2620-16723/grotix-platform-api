name: Deploy to Azure VM (manual)
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Previously published GHCR release tag (vX.Y.Z)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy:
    name: Deploy release via SSH
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate release and prepare SSH identity
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          SSH_HOST_KEYS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          test -n "$SSH_KEY" && test -n "$SSH_HOST_KEYS"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_HOST_KEYS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Deploy approved images without auto-migration
        shell: bash
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
          VM_PATH: ${{ secrets.AZURE_VM_REPO_PATH }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          test -n "$VM_HOST" && test -n "$VM_USER" && test -n "$VM_PATH"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          prefix="ghcr.io/${owner}/grotix-"
          printf -v cmd 'cd %q && bash scripts/deploy-release.sh %q %q' "$VM_PATH" "$prefix" "$IMAGE_TAG"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
             "$VM_USER@$VM_HOST" "$cmd"
