name: Publish backend images (GHCR)
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (e.g. v1.0.0-rc.1)'
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Grotix-backend.sln
      - name: Build release
        run: dotnet build Grotix-backend.sln -c Release --no-restore
      - name: Execute tests
        run: dotnet test Grotix-backend.sln -c Release --no-build
      - name: Validate deploy files
        run: python3 scripts/validate_deployment.py
  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: gateway, project: Gateway.Api}
          - {name: profiles, project: Profiles.Api}
          - {name: cultivation, project: CultivationArea.Api}
          - {name: telemetry, project: Telemetry.Api}
          - {name: hardware, project: HardwareDevice.Api}
          - {name: irrigation, project: IrrigationCycle.Api}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable image version
        id: image
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo 'Use a semantic version vX.Y.Z[-suffix]' >&2
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/grotix-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/${{ matrix.project }}/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          provenance: true
