name: Backend CI
on:
  push:
    branches: [main, develop, 'feature/**', 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Static deployment validation
        run: python3 scripts/validate_deployment.py
      - name: Validate Compose interpolation and syntax
        env:
          JWT_SECRET: CI_ONLY_NOT_FOR_DEPLOYMENT_EXAMPLE_1234567890
          CORS_ALLOWED_ORIGIN: https://example.com
          MYSQL_HOST: example.com
          MYSQL_USER: ci
          MYSQL_PASSWORD: fake-ci-password
          POSTGRES_HOST: example.com
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: fake-ci-password
          GROTIX_DOMAIN: api.example.com
        run: docker compose config -q
      - name: Restore
        run: dotnet restore Grotix-backend.sln
      - name: Build
        run: dotnet build Grotix-backend.sln --configuration Release --no-restore
      - name: Test all suites
        run: dotnet test Grotix-backend.sln --configuration Release --no-build --logger 'trx;LogFileName=results.trx'
      - name: Upload TRX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
