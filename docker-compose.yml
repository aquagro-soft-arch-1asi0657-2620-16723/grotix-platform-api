# Core APIs. Only the gateway binds to localhost. Use --profile public for HTTPS ingress.
# The databases and Crop Analysis are external dependencies: see docs/DEPLOYMENT_AZURE_VM.md.
name: grotix
x-common-env: &common-env
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: "8080"
  TokenSettings__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
  Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:?Set CORS_ALLOWED_ORIGIN in .env}
  ConnectionStrings__DefaultConnection: "Server=${MYSQL_HOST:?Set MYSQL_HOST};Port=${MYSQL_PORT:-3306};Database=${MYSQL_DB:-grotix_core};User=${MYSQL_USER:?Set MYSQL_USER};Password=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD};SslMode=${MYSQL_SSL_MODE:-Required};"
  ConnectionStrings__TelemetryTimescale: "Host=${POSTGRES_HOST:?Set POSTGRES_HOST};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-grotix_telemetry};Username=${POSTGRES_USER:?Set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD};SSL Mode=${POSTGRES_SSL_MODE:-VerifyFull};Trust Server Certificate=${POSTGRES_TRUST_SERVER_CERTIFICATE:-false};"
  RabbitMq__Enabled: ${RABBITMQ_ENABLED:-false}
  RabbitMq__Uri: ${RABBITMQ_URI:-}
  RabbitMq__HostName: ${RABBITMQ_HOST:-rabbitmq}
  RabbitMq__Port: ${RABBITMQ_PORT:-5672}
  RabbitMq__UserName: ${RABBITMQ_USER:-grotix}
  RabbitMq__Password: ${RABBITMQ_PASSWORD:-}
  Swagger__Enabled: ${SWAGGER_ENABLED:-false}

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true

services:
  gateway:
    <<: *service-defaults
    build:
      context: .
      dockerfile: src/Gateway.Api/Dockerfile
    image: ${IMAGE_PREFIX:-grotix-}gateway:${IMAGE_TAG:-local}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-5100}:8080"
    environment:
      <<: *common-env
      ReverseProxy__Clusters__profiles-cluster__Destinations__d1__Address: http://profiles:8080/
      ReverseProxy__Clusters__cultivation-cluster__Destinations__d1__Address: http://cultivation:8080/
      ReverseProxy__Clusters__telemetry-cluster__Destinations__d1__Address: http://telemetry:8080/
      ReverseProxy__Clusters__hardware-cluster__Destinations__d1__Address: http://hardware:8080/
      ReverseProxy__Clusters__irrigation-cluster__Destinations__d1__Address: http://irrigation:8080/
      ReverseProxy__Clusters__crop-analysis-cluster__Destinations__d1__Address: ${CROP_ANALYSIS_URL:-http://crop-analysis:8000/}
    depends_on:
      - profiles
      - cultivation
      - telemetry
      - hardware
      - irrigation

  profiles:
    <<: *service-defaults
    build:
      context: .
      dockerfile: src/Profiles.Api/Dockerfile
    image: ${IMAGE_PREFIX:-grotix-}profiles:${IMAGE_TAG:-local}
    environment:
      <<: *common-env
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}

  cultivation:
    <<: *service-defaults
    build:
      context: .
      dockerfile: src/CultivationArea.Api/Dockerfile
    image: ${IMAGE_PREFIX:-grotix-}cultivation:${IMAGE_TAG:-local}
    environment:
      <<: *common-env
      ZoneReports__GatewayBaseUrl: http://gateway:8080

  telemetry:
    <<: *service-defaults
    build:
      context: .
      dockerfile: src/Telemetry.Api/Dockerfile
    image: ${IMAGE_PREFIX:-grotix-}telemetry:${IMAGE_TAG:-local}
    environment:
      <<: *common-env

  hardware:
    <<: *service-defaults
    build:
      context: .
      dockerfile: src/HardwareDevice.Api/Dockerfile
    image: ${IMAGE_PREFIX:-grotix-}hardware:${IMAGE_TAG:-local}
    environment:
      <<: *common-env

  irrigation:
    <<: *service-defaults
    build:
      context: .
      dockerfile: src/IrrigationCycle.Api/Dockerfile
    image: ${IMAGE_PREFIX:-grotix-}irrigation:${IMAGE_TAG:-local}
    environment:
      <<: *common-env

  caddy:
    <<: *service-defaults
    profiles: [public]
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      GROTIX_DOMAIN: ${GROTIX_DOMAIN:-api.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway

volumes:
  caddy_data:
  caddy_config:
